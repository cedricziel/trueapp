name: truenas_native_plugins
description: Native iOS/macOS plugins for TrueNAS Manager app providing CloudKit synchronization and Keychain storage
version: 0.1.0
homepage: https://github.com/cedricziel/trueapp

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TruenasNativePlugins
        sharedDarwinSource: true
      macos:
        pluginClass: TruenasNativePlugins
        sharedDarwinSource: true
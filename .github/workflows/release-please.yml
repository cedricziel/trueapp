name: Release Please

# Release automation:
#   push to main → release-please opens/updates the release PR (bumps
#                  pubspec.yaml + CHANGELOG.md). Merging it tags vX.Y.Z and
#                  creates a draft release; the publish step flips it to a
#                  prerelease and the testflight job uploads the build.

on:
  push:
    branches: [main]

env:
  # Keep in sync with ci.yml.
  FLUTTER_VERSION: '3.47.2'

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please labels its release PRs; with the GITHUB_TOKEN
      # fallback that needs issues: write.
      issues: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # RELEASE_PLEASE_TOKEN (a fine-grained PAT) makes the release PR a
          # user-authored PR so the required CI check runs. Releases are
          # created as DRAFTS (see release-please-config), which fire no
          # events and have no tag yet; the publish step below turns the
          # draft into a prerelease with the event-suppressed GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish draft as prerelease
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.rp.outputs.tag_name }}" --repo "${{ github.repository }}" --draft=false --prerelease

  testflight:
    name: Upload to TestFlight
    needs: release-please
    permissions:
      contents: read
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count at the tag.
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          # Same key as ci.yml so release builds reuse its warm cache.
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Configure SSH for match repo
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin GitHub's published host keys (TLS-authenticated source)
          # instead of trusting whatever answers ssh-keyscan.
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build and upload iOS to TestFlight
        env:
          ASC_KEY_ID:                            ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                         ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:                       ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL:                         ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:                        ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD:               ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_HIDE_CHANGELOG:               "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT:  "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES:  "5"
        run: |
          bundle exec fastlane beta \
            allow_dirty:true \
            changelog:"Release ${{ needs.release-please.outputs.tag_name }}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrueNASManager-${{ needs.release-please.outputs.tag_name }}
          path: build/*.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Build and upload macOS to TestFlight
        env:
          ASC_KEY_ID:                            ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:                         ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT:                       ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_GIT_URL:                         ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD:                        ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_PASSWORD:               ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          FASTLANE_HIDE_CHANGELOG:               "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT:  "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES:  "5"
        run: |
          bundle exec fastlane beta_mac \
            allow_dirty:true \
            changelog:"Release ${{ needs.release-please.outputs.tag_name }}"

      - name: Upload macOS pkg artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrueNASManager-macOS-${{ needs.release-please.outputs.tag_name }}
          path: build/macos/*.pkg
          if-no-files-found: ignore
          retention-days: 30

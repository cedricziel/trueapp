name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Single source of truth: the SDK the job installs and the key its cache is
  # scoped to must never drift apart.
  FLUTTER_VERSION: '3.47.2'

jobs:
  test:
    permissions:
      contents: read
    runs-on: macos-latest
    # A hanging test used to keep this job alive until the runner limit was
    # reached, which hides the failure and blocks the queue. Fail fast instead.
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        # build/ is deliberately not cached. It holds Xcode's precompiled Swift
        # modules, which are bound to the exact FlutterMacOS.framework headers
        # they were built against. Restoring them across a toolchain change
        # fails the macOS build with "has been modified since the module file
        # was built" - and the runner's Xcode can move without any key of ours
        # changing, so scoping alone would not be enough.
        path: |
          ~/.pub-cache
          **/.dart_tool
        # .dart_tool is SDK-specific too, so the key and the fallback both carry
        # the Flutter version.
        key: ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

    - name: Get dependencies
      run: flutter pub get

    - name: Generate code
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run static analysis
      run: flutter analyze

    - name: Check formatting
      run: dart format --set-exit-if-changed .

    - name: Run tests
      run: |
        # Run all tests with expanded reporter for better CI output
        flutter test --reporter=expanded \
          --timeout=30s \
          --no-pub

    - name: Run fastlane helper tests
      run: ruby fastlane/test/pubspec_version_test.rb

    - name: Build iOS (no codesign)
      run: flutter build ios --no-codesign

    # `flutter build macos` has no --no-codesign flag, and the runner has no
    # signing identity, so the Release configuration's Manual signing fails
    # with "No profiles for 'com.cedricziel.trueapp' were found". Flutter
    # forwards FLUTTER_XCODE_<setting> to xcodebuild, which lets CI compile
    # without signing - the same intent as --no-codesign on the iOS step.
    - name: Build macOS (no codesign)
      env:
        FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
        FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
        FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
      run: flutter build macos

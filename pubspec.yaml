name: truehub
description: "A Flutter app to manage TrueNAS servers."
license: AGPL-3.0
publish_to: 'none'

version: 0.13.0+23

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # JSON-RPC client
  json_rpc_2: ^4.1.0

  # Local storage
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  # database.dart's migration steps catch SqliteException directly to make
  # themselves idempotent against a partially-applied prior run - already a
  # transitive dep of drift, listed explicitly since it's imported directly.
  sqlite3: ^3.7.0

  # State management
  provider: ^6.1.5+1

  # Utilities
  equatable: ^3.0.0
  uuid: ^4.6.0

  # UI enhancements
  flutter_slidable: ^4.0.3
  stream_channel: ^2.1.4

  # WebSocket support
  web_socket_channel: ^3.0.3

  # Network connectivity detection
  connectivity_plus: ^7.3.2
  network_info_plus: ^8.2.2
  permission_handler: ^13.0.2

  # System tray/menu bar support
  tray_manager: ^0.7.0

  # URL launcher for opening app URLs
  url_launcher: ^6.3.3

  # Navigation packages for adaptive sidebar
  go_router: ^18.0.2
  cupertino_sidebar: ^1.0.1

  # Native plugins for CloudKit and Keychain
  truenas_native_plugins:
    path: packages/truenas_native_plugins

  # OpenTelemetry SDK (logs signal).
  flutter_otel: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  dart_pre_commit: ^6.1.5
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/branding/

dart_pre_commit:
  format: true
  analyze: true
  outdated: true
